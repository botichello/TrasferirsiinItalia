name: Content freshness

# Surfaces guide pages that are past their review date, so the "always
# up to date" promise is enforced rather than hoped for.
on:
  schedule:
    - cron: '0 7 * * 1' # every Monday 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/content/**'

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # On PRs touching content, fail if anything is structurally invalid.
      # The scheduled run also fails on overdue pages (FRESHNESS_STRICT=1) so a
      # red check nags maintainers to re-verify.
      - name: Check freshness
        env:
          FRESHNESS_STRICT: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/check-freshness.mjs
      # Same reason, different axis: a page can be in date and still state an
      # amount the statute changed. Cheap enough to run on every content PR.
      - name: Check figures
        run: node scripts/check-figures.mjs
