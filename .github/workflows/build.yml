name: Build gates

# The full build is the test suite: the freshness gate (dated, sourced
# content), the Astro build, and the SEO gate (canonicals, hreflang,
# sitemap, JSON-LD, internal links). Green here means shippable.
on:
  pull_request:
  push:
    branches: ['claude/focused-newton-1wfqgd']
  workflow_dispatch:

# The default GITHUB_TOKEN is repo-writable unless narrowed; these jobs only read.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Prove the SEO gate still fails on the breakage it claims to catch: it
      # is run against deliberately broken copies of dist/, one fault at a
      # time. Guards against a rule silently stopping firing.
      - run: npm run test:gates
      # E2E smoke + axe accessibility scan against the built site. The
      # chromium build must match playwright-core's registry version.
      - name: Install Chromium
        run: npx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium
      - run: npm run test:smoke
