name: tft-stock-predictor CI

on:
  push:
    paths:
      - "tft-stock-predictor/**"
      - ".github/workflows/tft-predictor-ci.yml"
  pull_request:
    paths:
      - "tft-stock-predictor/**"
      - ".github/workflows/tft-predictor-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tft-stock-predictor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tft-stock-predictor/requirements.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
